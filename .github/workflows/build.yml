name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nexclusive (${{ matrix.minecraft_version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft_version: "26.1.2"
            fabric_version: "0.155.2+26.1.2"
            loader_version: "0.19.3"
            noammaddons_version: "1.3.1"
          - minecraft_version: "26.2"
            fabric_version: "0.161.0+26.2"
            loader_version: "0.19.5"
            noammaddons_version: "1.3.1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build JAR for ${{ matrix.minecraft_version }}
        run: ./gradlew jar -Pminecraft_version="${{ matrix.minecraft_version }}" -Pfabric_version="${{ matrix.fabric_version }}" -Ploader_version="${{ matrix.loader_version }}" -Pnoammaddons_version="${{ matrix.noammaddons_version }}" --build-cache

      - name: Upload Nexclusive ${{ matrix.minecraft_version }} JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nexclusive-${{ matrix.minecraft_version }}
          path: build/libs/Nexclusive-*-${{ matrix.minecraft_version }}.jar
          if-no-files-found: error
          compression-level: 0
